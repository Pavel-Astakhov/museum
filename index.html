<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main_container">
        <header>
            <div class="header">
                <div class="logo">
                    <div class="frame">
                        <img src="images/Frame.svg" alt="logo">
                    </div>
                    <div class="title">
                        <span>LOUVRE</span>
                    </div>
                </div>
                <ul class="navigation">
                    <li class="navigation_list">Visiting</li>
                    <li class="navigation_list">Explore</li>
                    <li class="navigation_list">Video</li>
                    <li class="navigation_list">Gallery</li>
                    <li class="navigation_list">Tickets</li>
                    <li class="navigation_list">Contacts</li>
                </ul>
            </div>
        </header>
        <main>
            <section class="welcome">
                <div class="welcome_content">
                    <div class="discover">
                        <div class="discover_title">
                            <span>Welcome <br> to the Louvre</span>
                        </div>
                        <div class="discover_description">
                            <span>From the castle to the museum</span>
                        </div>
                        <div class="discover_button">
                            <div class="discover_button_bg">
                                <div class="discover_button_text">
                                    <span>Discover the Louvre</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="promo">
                        <div class="promo_bg">
                            <img src="/images/bg.svg" alt="background">
                        </div>
                        <div class="promo_slider"></div>
                    </div>
                </div>
            </section>
            <section class="visiting"></section>
            <section class="explore"></section>
            <section class="video"></section>
            <section class="gallery"></section>
            <section class="tickets"></section>
            <section class="contacts"></section>
        </main>
        <footer></footer>
    </div>
</body>

</html>
